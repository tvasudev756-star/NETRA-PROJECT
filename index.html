<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
   <header class ="tophead"> 
<div class="logo">   
    <div class ="brand-logo"> N</div>
<div>
<h1>NETRA</h1><br/>
<P> ROBOT MISSION CONTROL</P>
</div>
</div>
<nav>
<a href="#"> Dashboard</a>
<a href="#"> Fleet</a>
<a href="#"> Telementry</a>
<a href="#"> Alerts  </a>
</nav>
<!--System online content and clock placement-->
<div class=" system.dot">  
<span class="dot"></span>
<span> System Online</span>
<strong id="clock">--:--:--</strong>
</div>
<button id="dispath-open" type="button">+Dispatch MISSION</button>
   </header>

<main class="page">
    <section class="kpi-grid">
        <article class="kpi-card">
<span>ROVERS ONLINE</span>
<h2 id="rover-count"> 6/6</h2>
<p> ACTIVE ROVERS UNITS</p>
        </article>
        <article class="kpi-card">
<span> AVERAGE BATTERY</span>
<h2 id="battery-level">73%</h2>
<p>FLEET BATTERY LEVEL</p>
        </article>
        <article class="kpi-card">
<span>OPEN ALERTS</span>
<h2 id="alerts-count">2</h2>
<p>REQUIRED ATTENTION</p>
        </article>
         <article class="kpi-card">
<span>DISTANCE TODAY</span>
<h2 id="distance-covered">13.88KM</h2>
<p>TOTAL SIMULATED  DISTANCE</p>
        </article>
    </section>
</main>
<script src="script.js"></script>

</body>
</html>
